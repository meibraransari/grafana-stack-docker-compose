services:
  grafana:
    # Grafana Dashboard
    image: grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    user: 1001:1001
    networks:
      - grafana
    ports:
      - 3000:3000
    environment:
      - VIRTUAL_HOST=grafana
      - GF_SERVER_ROOT_URL=https://grafana.tokenlinx.com
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USERNAME:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      # - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      # - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      # - 'GF_SMTP_ENABLED=true'
      # - 'GF_SMTP_HOST=192.168.1.222:3465'
      # - 'GF_SMTP_USER=iansari@test.com'
      # - 'GF_SMTP_PASSWORD=iansari@test.com'
      # - 'GF_SMTP_FROM_ADDRESS=iansari@test.com'
    depends_on:
      - prometheus
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./config/grafana/provisioning/:/etc/grafana/provisioning/
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      version: "latest"
      org.label-schema.group: "monitoring"
      description: "Deployed on 09-05-2026"
  # Prometheus Database
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    hostname: prometheus
    restart: unless-stopped
    user: 1001:1001
    networks:
      - grafana
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.external-url=http://192.168.1.222:9090'
      #- '--enable-feature=remote-write-receiver'
      #- '--query.lookback-delta=30s'
      - '--log.level=debug'
    ports:
      - 9090:9090
    volumes:
      - ./config/prometheus/:/etc/prometheus/
      - ./data/prometheus:/prometheus/
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      version: "latest"
      org.label-schema.group: "monitoring"
      description: "Deployed on 09-05-2026"
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    networks:
      - grafana
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - '9093:9093'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      version: "latest"
      org.label-schema.group: "monitoring"
      description: "Deployed on 09-05-2026"
  nodeexporter:
    image: prom/node-exporter:latest
    container_name: nodeexporter
    restart: unless-stopped
    user: 1001:1001
    ports:
      - "9100:9100"
    networks:
      - grafana
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude'
      - '^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      version: "latest"
      org.label-schema.group: "monitoring"
      description: "Deployed on 09-05-2026"
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    hostname: cadvisor
    restart: unless-stopped
    ports:
      - 8080:8080
    networks:
      - grafana
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /cgroup:/cgroup:ro #doesn't work on MacOS only for Linux
      - /dev/disk/:/dev/disk:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      version: "latest"
      org.label-schema.group: "monitoring"
      description: "Deployed on 09-05-2026"
networks:
  grafana:
    driver: bridge
    name: grafana
    #external: true  # Use the existing 'grafana' network
