services:
  grafana:
    # Grafana Dashboard
    image: grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    user: 1001:1001
    networks:
      - grafana
    ports:
      - 3000:3000
    environment:
      - VIRTUAL_HOST=grafana
      - GF_SERVER_ROOT_URL=https://grafana.tokenlinx.com
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USERNAME:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      # - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      # - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      # - 'GF_SMTP_ENABLED=true'
      # - 'GF_SMTP_HOST=192.168.192.221:3465'
      # - 'GF_SMTP_USER=iansari@test.com'
      # - 'GF_SMTP_PASSWORD=iansari@test.com'
      # - 'GF_SMTP_FROM_ADDRESS=iansari@test.com'
    depends_on:
      - prometheus
    volumes:
      - ${DOCKER_VOLUME_STORAGE:-/mnt/docker-volumes}/grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning/:/etc/grafana/provisioning/
    labels:
      version: "latest"
      org.label-schema.group: "monitoring"
      description: "Deployed on 09-05-2026"
  # Prometheus Database
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    hostname: prometheus
    restart: unless-stopped
    user: 1001:1001
    networks:
      - grafana
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.external-url=http://192.168.192.200:9090'
      #- '--enable-feature=remote-write-receiver'
      #- '--query.lookback-delta=30s'
      - '--log.level=debug'
    ports:
      - 9090:9090
    volumes:
      #- ${DOCKER_VOLUME_STORAGE:-/mnt/docker-volumes}/prometheus/etc/prometheus:/etc/prometheus
      #- ${DOCKER_VOLUME_STORAGE:-/mnt/docker-volumes}/prometheus/prometheus:/prometheus
      - ./config/prometheus/:/etc/prometheus/
      - ${DOCKER_VOLUME_STORAGE:-/mnt/docker-volumes}/prometheus_data/:/prometheus/
      #    environment:
      #      - VIRTUAL_HOST=prometheus
    labels:
      version: "latest"
      org.label-schema.group: "monitoring"
      description: "Deployed on 09-05-2026"
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    networks:
      - grafana
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - '9093:9093'
    labels:
      version: "latest"
      org.label-schema.group: "monitoring"
      description: "Deployed on 09-05-2026"
networks:
  grafana:
    driver: bridge
    name: grafana
    #external: true  # Use the existing 'grafana' network
