# Mail with headings
receivers:
  - name: 'email-alert'
    email_configs:
      - to: 'ibrar.ansari@localhost.com, ibrar@localhost.com'
        send_resolved: true
        headers:
          Subject: '🚨 Alert: {{ .CommonLabels.alertname }}'



