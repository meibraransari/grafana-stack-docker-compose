global:
  smtp_smarthost: 'smtp.sendgrid.net:587'
  smtp_from: 'noreply@tokenlinx.com'
  smtp_auth_username: 'apikey'
  smtp_auth_password: 'my_secret_key'
  smtp_require_tls: true

route:
  receiver: 'email-alert'
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 24h

# | Setting         | Time in your config | What it controls                                                  |
# | --------------- | ------------------- | ----------------------------------------------------------------- |
# | group_wait      | 1s                  | Wait after first alert in group before sending notification       |
# | group_interval  | 10s                 | Minimum time between notifications for same alert group           |
# | repeat_interval | 1m                  | How often to resend notification for alerts that are still firing |


